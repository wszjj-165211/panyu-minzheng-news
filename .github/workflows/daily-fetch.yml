name: daily-fetch

on:
  schedule:
    # 北京时间每天 10:30 = UTC 02:30（GitHub 定时偶发漏跑，5 分钟后再试一次，重复触发会自动跳过）
    - cron: '30 2 * * *'
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 一键脚本：抓取 5 个源 + 打包生成 index.html
      - name: Run all-in-one script
        run: python run_all.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet && git diff --cached --quiet; then
            echo "今天没有新内容，跳过提交"
          else
            git commit -m "每日自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
