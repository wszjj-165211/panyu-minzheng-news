name: daily-fetch

on:
  schedule:
    # 北京时间每天 10:30 = UTC 02:30
    - cron: '30 2 * * *'
    # 兜底：GitHub Actions 定时偶发漏触发，5 分钟后再试一次（并发锁自动去重）
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily fetch
        run: python scripts/fetch_all.py --pages 2

      - name: Build embedded-data page
        run: python scripts/build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "每日自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
