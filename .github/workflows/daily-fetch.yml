name: daily-fetch

on:
  schedule:
    # GitHub 定时偶发漏跑 → 每小时唤醒一次，脚本自己判断是否该干活（10:00 前不跑、当天已更新自动跳过）
    - cron: '0 * * * *'
    # 主更新时间：北京时间 10:30 / 10:35（10:00 的每小时唤醒已覆盖）
    - cron: '30 2 * * *'
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 一键脚本：抓取 5 个源 + 打包生成 index.html（手动触发强制跑，定时触发自动去重）
      - name: Run all-in-one script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python run_all.py --force
          else
            python run_all.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet && git diff --cached --quiet; then
            echo "今天没有新内容，跳过提交"
          else
            git commit -m "每日自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
