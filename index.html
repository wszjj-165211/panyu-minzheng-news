<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>民政新闻助手</title>
<meta name="description" content="民政领域2026年新闻报道库，支持业务分类/主题标签检索、问答助手、统计概览，供民政系统文书部门撰写上报材料使用。">
<meta property="og:title" content="民政新闻助手">
<meta property="og:description" content="民政领域2026年新闻报道库 · 分类检索 / 问答助手 / 统计概览">
<meta property="og:type" content="website">
<meta property="og:image" content="https://wszjj-165211.github.io/panyu-minzheng-news/logo.png">
<style>
:root{
  --blue:#2B6CB0; --blue-d:#1E5AA8; --blue-l:#E8F1FA;
  --bg:#F3F5F9; --card:#FFFFFF; --line:#E6EAF2;
  --text:#2B2F38; --text2:#5B6372; --text3:#9AA1AF;
  --green:#3E7C22; --danger:#C0392B; --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow-x:hidden;word-wrap:break-word;overflow-wrap:break-word}
img,svg,canvas{max-width:100%;height:auto}
a{color:var(--blue);word-break:break-all}
button{font-family:inherit}

#app{max-width:720px;margin:0 auto;min-height:100vh;display:none;flex-direction:column}
.app-show{display:flex !important}

/* ===== 密码门 ===== */
#gate{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{width:100%;max-width:340px;background:#fff;border-radius:16px;padding:30px 24px;text-align:center;box-shadow:0 4px 24px rgba(30,90,168,.08)}
#gate h1{font-size:19px;font-weight:500;color:var(--blue-d);margin-bottom:4px}
#gate .sub{font-size:12px;color:var(--text3);margin-bottom:22px}
#gate input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:16px;text-align:center;outline:none}
#gate input:focus{border-color:var(--blue)}
#gate .err{color:var(--danger);font-size:12px;margin-top:8px;min-height:18px}
#gate .remember{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
#gate .remember input{width:16px;height:16px;accent-color:var(--blue);margin:0}
#gate button{width:100%;height:46px;margin-top:10px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;cursor:pointer}
#gate button:active{background:var(--blue-d)}
#gate .tip{font-size:11px;color:var(--text3);margin-top:16px;line-height:1.6}

/* ===== 下拉刷新 ===== */
#pullWrap{position:relative;height:0;overflow:hidden;background:var(--bg);z-index:25}
#pullWrap .pull-inner{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--text3);font-size:12px}
.pull-ic{width:22px;height:22px;border:2px solid var(--blue-l);border-top-color:var(--blue);border-right-color:var(--blue);border-radius:50%;transition:transform .15s ease}
.pull-ic.arrow{transform:rotate(180deg)}
.pull-ic.spin{animation:spin .7s linear infinite;border-top-color:var(--blue);border-right-color:var(--blue);border-bottom-color:var(--blue-l);border-left-color:var(--blue-l)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 分享弹窗（海报模式） ===== */
.hbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:9px;font-size:12px;padding:4px 11px;cursor:pointer;margin-left:6px;line-height:1.5}
.hbtn:active{background:rgba(255,255,255,.35)}
#refreshBtn{background:#fff;color:var(--blue-d);border:none;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.22)}
#refreshBtn:active{background:#E8F1FA}

.modal-mask{position:fixed;inset:0;z-index:90;background:rgba(15,25,40,.58);display:none;align-items:center;justify-content:center;padding:16px}
.modal-mask.show{display:flex}
.modal{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:18px 16px 16px;text-align:center;box-shadow:0 12px 44px rgba(0,0,0,.28);max-height:94vh;overflow-y:auto;position:relative}
.modal .m-close{position:absolute;top:8px;right:10px;width:28px;height:28px;border:none;background:var(--bg);border-radius:50%;color:var(--text3);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.modal .m-close:active{background:var(--line)}
.modal .m-title{font-size:16px;font-weight:600;color:var(--blue-d);margin-bottom:12px;padding-right:24px}
.modal .posterBox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.modal .posterBox img{display:block;width:100%;max-width:300px;margin:0 auto;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.modal .posterTip{font-size:13px;color:var(--text);font-weight:500;margin-bottom:4px}
.modal .posterSub{font-size:12px;color:var(--text3);margin-bottom:10px;line-height:1.6}
.modal .m-link input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:11px;color:var(--text2);background:var(--bg);outline:none}
.modal .m-ops{display:flex;gap:10px;margin-top:12px}
.modal .m-ops button{flex:1;height:42px;border:none;border-radius:10px;font-size:13px;cursor:pointer}
.modal #copyUrlBtn{background:#F1F3F8;color:var(--text2)}
.modal #copyUrlBtn:active{background:var(--line)}
.modal #savePosterBtn{background:var(--blue);color:#fff}
.modal #savePosterBtn:active{background:var(--blue-d)}
.modal .m-wechat{margin-top:12px;font-size:12px;color:#2E5B19;background:#F0F5EA;border-radius:10px;padding:10px 12px;line-height:1.7;text-align:left;border:1px solid #DCE8D4}
.modal .m-wechat b{color:var(--blue-d)}

/* ===== 顶栏 ===== */
header{background:var(--blue-d);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(30,90,168,.18)}
header .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:500;letter-spacing:.5px}
header .meta{font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap}
#searchBox{display:flex;margin-top:10px;background:rgba(255,255,255,.14);border-radius:10px;padding:0 12px;align-items:center}
#searchBox .icon{color:rgba(255,255,255,.8);font-size:14px;margin-right:6px;flex-shrink:0}
#searchBox input{flex:1;min-width:0;height:38px;background:none;border:none;outline:none;color:#fff;font-size:14px}
#searchBox input::placeholder{color:rgba(255,255,255,.55)}
#searchClear{color:rgba(255,255,255,.7);font-size:16px;padding:2px 6px;display:none;cursor:pointer;flex-shrink:0}
#searchBox{position:relative}
#searchDrop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;z-index:80;display:none}
#searchDrop.show{display:block}
#searchDrop .head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:11px;color:var(--text3);border-bottom:1px solid var(--line);background:#FAFBFD}
#searchDrop .head button{border:none;background:none;color:var(--blue-d);font-size:11px;cursor:pointer;padding:2px 6px}
#searchDrop .si{display:flex;align-items:center;gap:6px;padding:10px 12px;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--line)}
#searchDrop .si:last-child{border-bottom:none}
#searchDrop .si:active{background:var(--blue-l)}
#searchDrop .si .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#searchDrop .si .x{color:var(--text3);font-size:12px;flex-shrink:0}

/* ===== 主体 ===== */
main{flex:1;overflow-y:auto;padding:12px 12px 66px;-webkit-overflow-scrolling:touch}

#statBar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:4px 4px 10px;font-size:12px;color:var(--text2)}
#statBar b{color:var(--blue-d);font-weight:500}
.statOps{display:flex;align-items:center;gap:8px}
.statOps button{font-size:11px;border-radius:10px;padding:2px 10px;cursor:pointer;height:24px;line-height:1}
#sortBtn{color:var(--blue-d);background:var(--blue-l);border:1px solid var(--blue)}
#sortBtn:active{background:var(--blue-d);color:#fff}
#exportBtn{color:var(--green);background:#F0F4EA;border:1px solid var(--green)}
#exportBtn:active{background:var(--green);color:#fff}

.filter-sec{margin-bottom:8px}
.filter-sec .ft{font-size:12px;color:var(--text3);margin:10px 4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ===== 筛选 chip（统一基础） ===== */
.chip{padding:6px 12px;border-radius:15px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--text2);cursor:pointer;user-select:none;white-space:nowrap;line-height:1.4;transition:box-shadow .12s,transform .06s}
.chip:active{transform:scale(.96)}
.chip .n{opacity:.65;font-size:11px;margin-left:3px}
.chip::before{content:"";display:none}

/* 业务分类：选中态（✓ + 深色描边 + 实心数字）——内联背景色不会覆盖描边/对勾 */
.chip.sel{box-shadow:0 0 0 2px var(--blue-d) inset;border-color:var(--blue-d);font-weight:600}
.chip.sel::before{content:"✓ ";display:inline;font-weight:700}
.chip.sel .n{background:var(--blue-d);color:#fff;border-radius:8px;padding:0 5px;opacity:1}

/* 主题标签：选中态（蓝底白字 + ✓） */
.chip.on{background:var(--blue-d);border-color:var(--blue-d);color:#fff;font-weight:600}
.chip.on::before{content:"✓ ";display:inline;font-weight:700}
.chip.on .n{color:#fff;opacity:.85}

/* 清除筛选按钮 */
#filterBar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
#filterBar .ft{margin:10px 4px 6px}
#resetBtn{display:none;font-size:11px;color:var(--blue-d);background:var(--blue-l);border:1px solid var(--blue);border-radius:12px;padding:3px 10px;cursor:pointer;margin:8px 4px 0;flex-shrink:0}
#resetBtn.show{display:inline-block}

/* ===== 新闻卡片 ===== */
.news{background:var(--card);border-radius:var(--radius);padding:12px 14px 12px 16px;margin-bottom:10px;border:1px solid var(--line);position:relative;overflow:hidden}
.news .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.news .top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.news .date{font-size:11px;color:var(--text3);white-space:nowrap}
.news .cat-tag{font-size:11px;padding:1px 9px;border-radius:9px;white-space:nowrap}
.news .tag-plus{font-size:10px;color:var(--text3)}
.news h3{font-size:15px;font-weight:500;line-height:1.5;margin-bottom:4px}
.news .src{font-size:11px;color:var(--text3);margin-bottom:6px;word-break:break-all}
.news .sum{font-size:13px;color:var(--text2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news.open .sum{-webkit-line-clamp:unset;display:block}
.news .note{margin-top:6px;font-size:11px;color:#B05A30;background:#FDF6EC;border-radius:6px;padding:4px 9px;display:none}
.news .note.show{display:block}
.news .ops{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.news .ops button{flex:1;min-width:84px;height:34px;border:none;border-radius:8px;font-size:12px;cursor:pointer}
.news .likes{display:flex;align-items:center;gap:8px;margin-top:8px}
.news .likes button{flex:0 0 auto;height:30px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:15px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:4px;transition:box-shadow .12s}
.news .likes button:active{transform:scale(.96)}
.news .likes .like.on{border-color:#D9A93C;background:#FBF3E2;color:#B7791F;font-weight:600}
.news .likes .dis{border-color:var(--line);background:#fff;color:var(--text3)}
.news .likes .dis:active{background:#F1F3F8}
.news .btn-link{background:var(--blue-l);color:var(--blue-d)}
.news .btn-copy{background:#F0F4EA;color:var(--green)}
.news .btn-more{background:#F3F4F6;color:var(--text2)}
.news .btn-link[disabled]{opacity:.4;cursor:default}
mark{background:#FFE58F;color:#8C5A00;border-radius:2px;padding:0 1px}
.empty{text-align:center;color:var(--text3);padding:50px 20px;font-size:13px}
.loadmore{text-align:center;padding:16px 0 34px}
.loadmore button{background:var(--card);border:1px solid var(--line);color:var(--blue);border-radius:20px;padding:9px 28px;font-size:14px;cursor:pointer}
.loadmore button:active{opacity:.7}
.loadmore .hint{font-size:12px;color:var(--text3);margin-top:8px}

/* ===== 月份筛选：移动端抽屉 / 电脑端右侧固定栏 ===== */
#monthMask{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:88;display:none}
#monthMask.show{display:block}
#monthFab{position:fixed;right:14px;bottom:74px;z-index:85;width:46px;height:46px;border-radius:50%;border:none;background:var(--blue-d);color:#fff;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(30,90,168,.35);cursor:pointer;display:flex;align-items:center;justify-content:center}
#monthFab:active{background:var(--blue)}
#monthSide{position:fixed;left:0;right:0;bottom:0;z-index:92;background:#fff;border-radius:18px 18px 0 0;padding:14px 16px 18px;box-shadow:0 -6px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .25s ease;max-height:62vh;overflow-y:auto}
#monthSide.show{transform:none}
#monthSide .m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#monthSide .m-head span{font-size:14px;font-weight:600;color:var(--blue-d)}
#monthSide .m-head .sub{font-size:11px;color:var(--text3);font-weight:400;margin-left:6px}
#monthSide .m-head button{border:none;background:var(--bg);width:26px;height:26px;border-radius:50%;color:var(--text3);cursor:pointer;font-size:12px;flex-shrink:0}
#monthReset{display:block;width:100%;height:38px;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer}
#monthReset:active{background:var(--line)}

/* ===== 统计概览页 ===== */
#ovView{display:none}
.ov-wrap{max-width:720px;margin:0 auto;padding:12px 12px 80px}
.ov-sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.ov-sec h2{font-size:14px;font-weight:600;color:var(--blue-d);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.ov-sec h2 .upd{font-size:11px;color:var(--text3);font-weight:400}
.ov-row{display:flex;align-items:center;margin-bottom:7px;font-size:12px;color:var(--text2)}
.ov-row .nm{width:92px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-row .bar-bg{flex:1;background:#F1F3F8;border-radius:6px;height:18px;overflow:hidden;margin:0 8px;min-width:0}
.ov-row .bar-fill{height:100%;border-radius:6px;min-width:4px;transition:width .35s ease}
.ov-row .cnt{width:34px;text-align:right;color:var(--text);font-weight:500;flex-shrink:0}
.ov-tags{display:flex;flex-wrap:wrap;gap:6px}
.ov-tags .t{font-size:12px;padding:4px 10px;border-radius:13px;background:var(--blue-l);color:var(--blue-d)}
.ov-tags .t b{font-weight:600}
.ov-empty{color:var(--text3);font-size:12px;text-align:center;padding:14px 0}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov-num{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center}
.ov-num .v{font-size:22px;font-weight:600;color:var(--blue-d)}
.ov-num .l{font-size:11px;color:var(--text3);margin-top:2px}

/* ===== 常用检索收藏 ===== */
.fav-item{display:flex;align-items:center;gap:8px;background:#FBF8F0;border:1px solid #EBD9B0;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px}
.fav-item .nm{flex:1;color:var(--text);min-width:0}
.fav-item .nm .d{color:var(--text3);font-size:11px}
.fav-item button{flex-shrink:0;border:none;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer}
.fav-use{background:#D9A93C;color:#fff}
.fav-del{background:#F1F3F8;color:var(--text3)}
.ov-li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px}
.ov-li .nm{flex:1;color:var(--text);min-width:0;line-height:1.5}
.ov-li .nm .d{color:var(--text3);font-size:11px;margin-top:1px}
.ov-li .op{flex-shrink:0;border:none;border-radius:8px;padding:5px 11px;font-size:11px;cursor:pointer}
.ov-li .op.go{background:var(--blue-l);color:var(--blue-d)}
.ov-li .op.restore{background:#EAF3E4;color:var(--green)}
.ov-li .op.del{background:#FDEDED;color:var(--danger)}
.ov-li .op:active{opacity:.75}

/* ===== 底部导航 ===== */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line)}
nav .wrap{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;height:54px;background:none;border:none;font-size:12px;color:var(--text3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button .ic{font-size:18px;line-height:1}
nav button.on{color:var(--blue-d)}

/* ===== 问答页 ===== */
#qaView{display:none}
.qa-wrap{max-width:720px;margin:0 auto;padding:12px 12px 110px}
.qa-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qa-suggest .s{font-size:12px;padding:6px 12px;border-radius:15px;background:#fff;border:1px solid var(--line);color:var(--text2);cursor:pointer}
.msg{display:flex;margin-bottom:12px}
.msg .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;margin-right:8px}
.msg.bot .av{background:var(--blue)}
.msg.user .av{background:#9CA3AF;margin-left:8px;order:2}
.msg .bub{max-width:82%;background:#fff;border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.7;border:1px solid var(--line);min-width:0}
.msg.user{flex-direction:row-reverse}
.msg.user .bub{background:var(--blue-d);color:#fff;border:none}
.msg.user .bub a{color:#BBD8F5}
.qa-item{padding:9px 0;border-bottom:1px dashed var(--line)}
.qa-item:last-child{border-bottom:none}
.qa-item .t{font-weight:500;font-size:13px;line-height:1.5}
.qa-item .m{font-size:12px;color:var(--text2);margin-top:3px}
.qa-item .d{font-size:11px;color:var(--text3);margin-top:3px}
.qa-input{position:fixed;bottom:54px;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:8px 12px}
.qa-input .wrap{max-width:720px;margin:0 auto;display:flex;gap:8px}
.qa-input input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:21px;padding:0 16px;font-size:14px;outline:none}
.qa-input input:focus{border-color:var(--blue)}
.qa-input button{width:66px;height:42px;border:none;border-radius:21px;background:var(--blue);color:#fff;font-size:14px;cursor:pointer;flex-shrink:0}
.qa-input button:active{background:var(--blue-d)}

/* ===== 响应式增强：电脑端(≥768px) ===== */
@media (min-width:768px){
  body{font-size:15px}
  header{padding:18px 24px 14px}
  header h1{font-size:20px}
  main{padding:18px 24px 80px}
  .news{padding:16px 20px 16px 22px;margin-bottom:12px;border-radius:14px}
  .news h3{font-size:16px}
  .news .sum{font-size:14px}
  .chip{font-size:13px;padding:7px 14px}
  .news .ops button{height:36px;font-size:13px}
  #searchBox input{height:42px}
  .qa-wrap{padding:18px 24px 120px}
  .msg .bub{font-size:14px;max-width:70%}
  .qa-input input{height:44px}
  .qa-input button{height:44px}
  nav button{height:56px}
}
@media (min-width:1100px){
  #app{max-width:860px}
  nav .wrap{max-width:860px}
  .qa-wrap{max-width:860px}
}

/* 数据自愈：确保 meta 必备字段齐全（cat_colors/dimensions），缺失即用默认补齐 */
function ensureMeta(j){
  if(!j.meta) j.meta = {};
  if(!j.meta.cat_colors || typeof j.meta.cat_colors !== "object") j.meta.cat_colors = DEFAULT_CAT_COLORS;
  if(!j.meta.dimensions) j.meta.dimensions = Object.keys(DEFAULT_CAT_COLORS);
  if(!j.meta.total && j.records) j.meta.total = j.records.length;
  return j;
}
/* 政府机构报道判断（来源名含 政府/民政局/慈善会 视为政府报道，其余为媒体报道） */
function isGovSource(r){
  var s = r.source || "";
  return s.indexOf("政府")>=0 || s.indexOf("民政局")>=0 || s.indexOf("慈善会")>=0;
}

function $(id){ return document.getElementById(id); }
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function sortKey(d){ return (d||"").replace(/[^\d-]/g,"") || "0000"; }
function getMonthKey(r){ var m=(r.date||"").match(/^(\d{4})-(\d{2})/); return m ? m[1]+"-"+m[2] : ""; }
function monthLabel(mk){ return mk.replace(/^\d{4}-0?/,"")+"月"; }
/* 基础匹配：跳过指定维度后判断 r 是否命中当前筛选（用于交叉计数） */
function baseMatch(r, skipCat, skipMonths, skipTags){
  if(!skipCat && curCat!=="全部" && r.category!==curCat) return false;
  if(!skipMonths && curMonths.length){
    var mk = getMonthKey(r);
    if(mk && curMonths.indexOf(mk)<0) return false;
  }
  if(!skipTags){
    for(var i=0;i<curTags.length;i++){ if(!tagHit(r,curTags[i])) return false; }
  }
  return true;
}

/* fetch 带超时：防止 api.github.com 等通道在国内网络挂起（默认 8 秒自动放弃，避免"打开要等1分钟"） */
function fetchT(url, ms){
  var c = typeof AbortController !== "undefined" ? new AbortController() : null;
  var t = setTimeout(function(){ if(c) c.abort(); }, ms || 8000);
  return fetch(url, {cache:"no-store", signal: c ? c.signal : undefined}).then(function(r){
    clearTimeout(t);
    if(!r.ok) throw new Error(r.status);
    return r;
  }, function(e){ clearTimeout(t); throw e; });
}
function loadData(){
  var spin = '<div class="empty" style="padding:50px 0"><div style="width:26px;height:26px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div>正在加载新闻数据，请稍候…</div>';
  var failMsg = '<div class="empty">数据加载失败，请检查网络后重试（页面内置数据版不受影响）。</div>';
  function done(j){
    DATA = ensureMeta(j);
    j = DATA;
    j.records.sort(function(a,b){ return sortKey(b.date) < sortKey(a.date) ? -1 : 1; });
    var upd = j.meta && (j.meta.updated_at || j.meta.generated_at) || "";
    if(upd) $("metaInfo").textContent = "共 " + j.meta.total + " 条 · 更新至 " + upd;
    else $("metaInfo").textContent = "共 " + j.meta.total + " 条";
    initChips(); render(); initOverview();
  }
  $("newsList").innerHTML = spin;
  /* 1. 内置数据（最高优先，构建时注入，永不失联）—— 秒开，随后后台静默拉取云端最新 */
  if(EMBEDDED_DATA){ done(EMBEDDED_DATA); setTimeout(silentRefresh, 600); return; }
  var v = new Date().toISOString().slice(0,10);
  /* 2. 同目录文件 */
  fetchT(DATA_URL + "?v=" + v, 10000)
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(done)
    .catch(function(){
      /* 3. CDN 兜底（国内可访问的 jsDelivr 镜像） */
      var cdns = [
        "https://cdn.jsdelivr.net/gh/wszjj-165211/panyu-minzheng-news@main/data/news_data.json",
        "https://raw.githubusercontent.com/wszjj-165211/panyu-minzheng-news/main/data/news_data.json"
      ];
      (function tryCdn(i){
        if(i >= cdns.length){ $("newsList").innerHTML = failMsg; return; }
        fetchT(cdns[i] + "?v=" + v, 8000)
          .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
          .then(done)
          .catch(function(){ tryCdn(i+1); });
      })(0);
    });
}

/* ===== 后台静默刷新：内嵌数据秒开后，静默拉取云端最新数据（有更新才提示） =====
   通道优先级：GitHub API（无CDN缓存，数据最新）→ jsDelivr CDN（国内可达）→ raw.githubusercontent（兜底）
   全部失败则静默保留内嵌数据，页面照常可用。 */
function silentRefresh(){
  if(!DATA || !DATA.records) return;
  var curUpd = (DATA.meta && (DATA.meta.updated_at || DATA.meta.generated_at)) || "";
  var curTot = (DATA.meta && DATA.meta.total) || DATA.records.length;
  var tryCh = [
    function(){   /* 通道1: GitHub API（contents 接口，base64 解码，无缓存） */
      return fetchT("https://api.github.com/repos/wszjj-165211/panyu-minzheng-news/contents/data/news_data.json?ref=main", 10000)
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(d){
          var bin = atob(d.content), bytes = new Uint8Array(bin.length);
          for(var k=0;k<bin.length;k++) bytes[k] = bin.charCodeAt(k);
          return JSON.parse(new TextDecoder("utf-8").decode(bytes));
        });
    },
    function(){   /* 通道2: jsDelivr CDN（国内可达，缓存约12小时） */
      return fetchT("https://cdn.jsdelivr.net/gh/wszjj-165211/panyu-minzheng-news@main/data/news_data.json?v=" + Date.now(), 8000)
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
    },
    function(){   /* 通道3: raw.githubusercontent（最后兜底） */
      return fetchT("https://raw.githubusercontent.com/wszjj-165211/panyu-minzheng-news/main/data/news_data.json?v=" + Date.now(), 8000)
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
    }
  ];
  (function next(i){
    if(i >= tryCh.length) return;   /* 全部失败：静默，不打扰 */
    tryCh[i]()
      .then(function(j){
        if(!j || !j.records) throw new Error("bad");
        j = ensureMeta(j);
        var newUpd = (j.meta && (j.meta.updated_at || j.meta.generated_at)) || "";
        var newTot = (j.meta && j.meta.total) || j.records.length;
        if(newUpd === curUpd && newTot === curTot) return;   /* 无新数据：无感 */
        DATA = j;
        j.records.sort(function(a,b){ return sortKey(b.date) < sortKey(a.date) ? -1 : 1; });
        $("metaInfo").textContent = newUpd ? "共 " + newTot + " 条 · 更新至 " + newUpd : "共 " + newTot + " 条";
        initChips(); render(); initOverview();
        toast(newUpd ? "✓ 已自动更新至最新（" + newUpd + "）" : "✓ 数据已更新至最新");
      })
      .catch(function(){ next(i+1); });
  })(0);
}

/* ===== 分类体系 =====
   一级「业务分类」：主分类，单选互斥（每篇唯一）
   二级「主题标签」：跨业务议题，多选叠加（AND）
   两套名称完全互补，不再重合。
*/
var MAIN_CATS = ["养老服务","社区慈善","社会救助","未成年人保护","婚姻登记","社会组织","基层治理","殡葬管理","区划地名","其他民政业务"];
var TAG_ALIAS = {          /* extra_cats 原始值 → 规范标签名 */
  "慈善":"慈善募捐","儿童":"困境儿童","残疾人":"残疾人精康","社工":"双百社工","殡葬":"殡葬服务"
};
var KW_TAGS = {            /* 用户重点议题 → 关键词探测（标题/摘要） */
  "银发经济":["银发经济"],
  "婚俗改革":["婚俗改革"],
  "婚姻家庭辅导":["婚姻家庭辅导","婚姻辅导","家庭辅导","爱·家·圆"],
  "甜蜜经济":["甜蜜经济"],
  "集体颁证":["集体颁证","颁证"],
  "智慧养老":["智慧养老","毫米波","雷达","适老化"],
  "敬老助老":["敬老","长者饭堂","颐康中心","百岁","老年大学"],
  "公益集市":["公益集市","义卖"],
  "爱心妈妈":["爱心妈妈","结对帮扶"],
  "慈善募捐":["募捐","捐赠","筹款","微心愿"]
};
var tagPool = {};   /* 规范标签 → 命中的新闻数 */

function tagsOf(r){
  var out = [];
  var ex = (r.extra_cats||[]).map(function(t){ return TAG_ALIAS[t]||t; });
  ex.forEach(function(t){ if(MAIN_CATS.indexOf(t)<0 && out.indexOf(t)<0) out.push(t); });
  Object.keys(KW_TAGS).forEach(function(t){
    if(out.indexOf(t)>=0) return;
    var hay = (r.title+" "+(r.summary||"")).toLowerCase();
    if(KW_TAGS[t].some(function(k){ return hay.indexOf(k.toLowerCase())>=0; })) out.push(t);
  });
  return out;
}
function tagHit(r,t){ return tagsOf(r).indexOf(t)>=0; }
function buildTagPool(){
  tagPool = {};
  DATA.records.forEach(function(r){
    tagsOf(r).forEach(function(t){ tagPool[t] = (tagPool[t]||0)+1; });
  });
}

/* ===== 筛选 chips ===== */
function initChips(){
  var cats = ["全部"].concat(MAIN_CATS.filter(function(c){ return DATA.meta.cat_colors[c]; }));
  $("catChips").innerHTML = cats.map(function(c){
    var n = c==="全部" ? DATA.meta.total : DATA.records.filter(function(r){return r.category===c;}).length;
    var st = c==="全部" ? "" : 'style="background:'+DATA.meta.cat_colors[c].bg+';color:'+DATA.meta.cat_colors[c].text+';border-color:'+DATA.meta.cat_colors[c].text+'44"';
    return '<span class="chip'+(c===curCat?" sel":"")+'" data-c="'+esc(c)+'" '+st+'>'+esc(c)+'<span class="n">'+n+'</span></span>';
  }).join("");

  buildTagPool();
  var ts = Object.keys(tagPool).sort(function(a,b){ return tagPool[b]-tagPool[a] || (a<b?-1:1); });
  $("tagChips").innerHTML = ts.map(function(t){
    return '<span class="chip'+(curTags.indexOf(t)>=0?" on":"")+'" data-t="'+esc(t)+'">'+esc(t)+'<span class="n">'+tagPool[t]+'</span></span>';
  }).join("");

  /* 月份 chips：从数据中提取 2026-01 ~ 2026-08 */
  var months = [];
  DATA.records.forEach(function(r){
    var mk = getMonthKey(r);
    if(mk && months.indexOf(mk)<0) months.push(mk);
  });
  months.sort();
  $("monthChips").innerHTML = months.map(function(mk){
    var n = DATA.records.filter(function(r){ return getMonthKey(r)===mk; }).length;
    return '<span class="chip'+(curMonths.indexOf(mk)>=0?" on":"")+'" data-m="'+esc(mk)+'">'+esc(monthLabel(mk))+'<span class="n">'+n+'</span></span>';
  }).join("");

  $("catChips").onclick = function(e){
    var t = e.target.closest(".chip"); if(!t) return;
    curCat = t.getAttribute("data-c"); render();
  };
  $("tagChips").onclick = function(e){
    var t = e.target.closest(".chip"); if(!t) return;
    var tag = t.getAttribute("data-t");
    var i = curTags.indexOf(tag);
    if(i>=0) curTags.splice(i,1); else curTags.push(tag);
    render();
  };
  $("monthChips").onclick = function(e){
    var t = e.target.closest(".chip"); if(!t) return;
    var mk = t.getAttribute("data-m");
    var i = curMonths.indexOf(mk);
    if(i>=0) curMonths.splice(i,1); else curMonths.push(mk);
    render();
  };
}

/* ===== 过滤 + 渲染 ===== */
function visibleRecords(){ return DATA.records.filter(function(r){ return !isDisliked(r.link); }); }
function filtered(){
  var kwl = kw.trim().toLowerCase();
  var list = visibleRecords().filter(function(r){
    if(!baseMatch(r,false,false,false)) return false;
    if(srcFilter==="gov" && !isGovSource(r)) return false;
    if(srcFilter==="media" && isGovSource(r)) return false;
    if(!kwl) return true;
    return (r.title+" "+(r.summary||"")+" "+(r.source||"")+" "+r.category+" "+r.extra_cats.join(" ")+" "+(r.note||"")).toLowerCase().indexOf(kwl) >= 0;
  });
  list.sort(function(a,b){
    var ka = sortKey(a.date), kb = sortKey(b.date);
    return sortMode==="desc" ? (ka<kb?1:ka>kb?-1:0) : (ka<kb?-1:ka>kb?1:0);
  });
  return list;
}
function hl(text){
  if(!kw.trim()) return esc(text);
  var t = esc(text);
  try{
    var re = new RegExp("("+kw.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    return t.replace(re,"<mark>$1</mark>");
  }catch(e){ return t; }
}
function selDesc(){
  var p = [];
  if(srcFilter!=="all") p.push(srcFilter==="gov"?"政府报道":"媒体报道");
  if(curCat!=="全部") p.push("分类："+curCat);
  if(curMonths.length) p.push("月份："+curMonths.map(monthLabel).join("+"));
  if(curTags.length) p.push("标签："+curTags.join("+"));
  if(kw.trim()) p.push("关键词："+kw.trim());
  return p.length ? "（"+p.join(" · ")+"）" : "";
}
function updateToolbar(){
  $("srcChips").querySelectorAll(".chip").forEach(function(c){
    c.classList.toggle("on", c.getAttribute("data-src")===srcFilter);
  });
  $("sortBtn").textContent = sortMode==="desc" ? "⤯ 按日期倒序" : "⤮ 按日期顺序";
}
function updateChipStates(){
  /* 单次遍历同时统计 分类/标签/月份 的交叉计数（替代原来的多重全量 filter，O(N)→O(N) 一遍跑完） */
  var catCnt = {}, tagCnt = {}, monCnt = {};
  var i, r, mk, catOK, monOK, tagOK;
  for(i = 0; i < DATA.records.length; i++){
    r = DATA.records[i];
    mk = getMonthKey(r);
    catOK = curCat === "全部" || r.category === curCat;
    monOK = !curMonths.length || !mk || curMonths.indexOf(mk) >= 0;
    tagOK = true;
    for(var t = 0; t < curTags.length; t++){ if(!tagHit(r, curTags[t])){ tagOK = false; break; } }
    /* 分类计数：忽略分类自身（跟随 月份+标签） */
    if(monOK && tagOK) catCnt[r.category] = (catCnt[r.category] || 0) + 1;
    /* 标签计数：忽略标签自身（跟随 分类+月份） */
    if(catOK && monOK) tagsOf(r).forEach(function(tg){ tagCnt[tg] = (tagCnt[tg] || 0) + 1; });
    /* 月份计数：忽略月份自身（跟随 分类+标签） */
    if(catOK && tagOK && mk) monCnt[mk] = (monCnt[mk] || 0) + 1;
  }
  /* 分类 chips：更新计数与选中态 */
  $("catChips").querySelectorAll(".chip").forEach(function(c){
    var cat = c.getAttribute("data-c");
    c.classList.toggle("sel", cat === curCat);
    var n = c.querySelector(".n"); if(!n) return;
    n.textContent = cat === "全部" ? DATA.meta.total : (catCnt[cat] || 0);
  });
  /* 标签 chips：重建（跟随 分类+月份） */
  var sortedTags = Object.keys(tagCnt).sort(function(a,b){ return tagCnt[b]-tagCnt[a] || (a<b?-1:1); });
  $("tagChips").innerHTML = sortedTags.map(function(t){
    return '<span class="chip'+(curTags.indexOf(t)>=0?" on":"")+'" data-t="'+esc(t)+'">'+esc(t)+'<span class="n">'+tagCnt[t]+'</span></span>';
  }).join("");
  /* 月份 chips：更新计数与选中态 */
  $("monthChips").querySelectorAll(".chip").forEach(function(c){
    var mkey = c.getAttribute("data-m");
    c.classList.toggle("on", curMonths.indexOf(mkey) >= 0);
    var n = c.querySelector(".n"); if(!n) return;
    n.textContent = monCnt[mkey] || 0;
  });
}
var PAGE_SIZE = 30;                 /* 分页渲染：首屏 30 条，滚动到底/点按钮 自动加载下一批 */
var renderList = [], renderedCount = 0;

function render(){
  renderList = filtered();
  updateChipStates();
  updateToolbar();
  $("statText").innerHTML = "共 <b>"+renderList.length+"</b> 条 "+selDesc();
  $("resetBtn").className = (curCat!=="全部"||curMonths.length||curTags.length||kw.trim()) ? "show" : "";
  if(!renderList.length){ $("newsList").innerHTML = '<div class="empty">没有符合条件的报道<br>可点击上方「清除筛选」重新选择</div>'; updateLoadMore(); return; }
  renderedCount = 0;
  $("newsList").innerHTML = "";
  appendNews(PAGE_SIZE);
  updateLoadMore();
}
function appendNews(n){
  var end = Math.min(renderedCount + n, renderList.length);
  if(end <= renderedCount) return;
  var i, r, html = "";
  for(i = renderedCount; i < end; i++){
    r = renderList[i];
    var cc = DATA.meta.cat_colors[r.category] || DATA.meta.cat_colors["其他民政业务"];
    var extra = r.extra_cats && r.extra_cats.length ? r.extra_cats.map(function(c){return '<span class="tag-plus">+'+esc(c)+'</span>';}).join("") : "";
    var note = r.note ? '<div class="note show">备注：'+esc(r.note)+'</div>' : "";
    var linkBtn = (r.link && r.link.indexOf("http")===0)
      ? '<button class="btn-link" data-url="'+esc(r.link)+'">查看原文 ↗</button>'
      : '<button class="btn-link" disabled>无独立链接</button>';
    var lk = likeState(r.link);
    html += '<div class="news" data-link="'+esc(r.link)+'">'
      + '<div class="bar" style="background:'+cc.text+'"></div>'
      + '<div class="top"><span class="date">'+esc(r.date)+'</span><span class="cat-tag" style="background:'+cc.bg+';color:'+cc.text+'">'+esc(r.category)+'</span>'+extra+'</div>'
      + '<h3>'+hl(r.title)+'</h3>'
      + '<div class="src">'+esc(r.source)+'</div>'
      + '<div class="sum">'+hl(r.summary||"")+'</div>'
      + note
      + '<div class="ops">'
      + '<button class="btn-more">展开摘要</button>'
      + linkBtn
      + '<button class="btn-copy">复制条目</button>'
      + '</div>'
      + '<div class="likes">'
      + '<button class="like'+(lk.fav?' on':'')+'">'+(lk.fav?'♥':'♡')+' 收藏</button>'
      + '<button class="dis">👎 不喜欢</button>'
      + '</div></div>';
  }
  renderedCount = end;
  var tmp = document.createElement("div");
  tmp.innerHTML = html;
  var cards = tmp.querySelectorAll(".news");
  [].forEach.call(cards, bindCard);
  while(tmp.firstChild) $("newsList").appendChild(tmp.firstChild);
}
function updateLoadMore(){
  var wrap = $("loadMoreWrap"), btn = $("loadMoreBtn"), hint = $("loadMoreHint");
  if(!wrap) return;
  var left = renderList.length - renderedCount;
  if(left <= 0){ wrap.style.display = "none"; return; }
  wrap.style.display = "block";
  btn.textContent = "加载更多（余 " + left + " 条）";
  hint.textContent = "已显示 " + renderedCount + " / " + renderList.length + " 条";
}
$("loadMoreBtn").onclick = function(){ appendNews(PAGE_SIZE); updateLoadMore(); };
var _scT;
window.addEventListener("scroll", function(){
  if(_scT) return;
  _scT = setTimeout(function(){
    _scT = null;
    if(renderedCount < renderList.length && $("newsList").children.length){
      var d = document.documentElement;
      if((window.innerHeight + window.pageYOffset) >= (d.scrollHeight - 700)){ appendNews(PAGE_SIZE); updateLoadMore(); }
    }
  }, 200);
}, false);

function bindCard(card){
  var link = card.getAttribute("data-link");
  var likeBtn = card.querySelector(".like"), disBtn = card.querySelector(".dis");
  likeBtn.onclick = function(){
    var s = likeState(link);
    setLike(link, "fav", !s.fav);
    if(!s.fav && s.dis) setLike(link, "dis", false);   /* 收藏与不喜欢互斥 */
    render();
    toast(!s.fav ? "已收藏 ♥（可在统计概览查看）" : "已取消收藏");
  };
  disBtn.onclick = function(){
    var s = likeState(link);
    if(!s.dis){
      setLike(link, "dis", true);
      setLike(link, "fav", false);
      render();
      toast("已隐藏该报道，可在「统计概览-已隐藏报道」中恢复");
    }
  };
  card.querySelector(".btn-more").onclick = function(){
    var open = card.classList.toggle("open");
    this.textContent = open ? "收起摘要" : "展开摘要";
  };
  var lb = card.querySelector(".btn-link");
  if(lb && lb.getAttribute("data-url")) lb.onclick = function(){
    recordRead({title:card.querySelector("h3").textContent, date:card.querySelector(".date").textContent, link:link});
    window.open(lb.getAttribute("data-url"),"_blank");
  };
  card.querySelector(".btn-copy").onclick = function(){ copyNews(card); };
  card.addEventListener("click", function(e){
    if(e.target.closest("button")) return;   /* 点按钮不记阅读，只有点卡片正文/标题记 */
    recordRead({title:card.querySelector("h3").textContent, date:card.querySelector(".date").textContent, link:link});
  });
}

/* ===== 复制（兼容微信） ===== */
function copyText(txt, doneCb, failCb){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(txt).then(doneCb, failCb); return; }
  ok ? doneCb() : failCb();
}
function copyNews(card){
  var h3 = card.querySelector("h3").textContent;
  var src = card.querySelector(".src").textContent;
  var date = card.querySelector(".date").textContent;
  var sum = card.querySelector(".sum").textContent;
  var lb = card.querySelector(".btn-link");
  var link = lb && lb.getAttribute("data-url") ? lb.getAttribute("data-url") : "无";
  var txt = "【"+date+"】"+h3+"\n来源："+src+"\n摘要："+sum+"\n原文："+link;
  copyText(txt, function(){ flash(card,"✓ 已复制"); }, function(){ flash(card,"长按手动复制"); });
}
function flash(card,msg){
  var o = card.querySelector(".btn-copy");
  o.textContent = msg;
  setTimeout(function(){ o.textContent="复制条目"; },1600);
}

/* ===== 按钮文字反馈 ===== */
function flashBtn(btn,msg){
  var old = btn.textContent;
  btn.textContent = msg;
  setTimeout(function(){ btn.textContent = old; },1800);
}

/* ===== 轻提示 toast ===== */
function toast(msg){
  var t = document.getElementById("mzToast");
  if(!t){
    t = document.createElement("div");
    t.id = "mzToast";
    t.style.cssText = "position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(18,28,42,.9);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;z-index:130;max-width:82%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:0 4px 14px rgba(0,0,0,.2)";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.style.opacity = "0"; }, 2000);
}

/* ===== 单条新闻 收藏 / 不喜欢（localStorage 持久化，与筛选组合收藏 ☆ 区分） ===== */
function loadLikes(){ try{ return JSON.parse(localStorage.getItem(LIKE_KEY)) || {}; }catch(e){ return {}; } }
function saveLikes(o){ try{ localStorage.setItem(LIKE_KEY, JSON.stringify(o)); }catch(e){} }
function likeState(link){ var o = loadLikes(); var s = o[link] || {}; return {fav:!!s.fav, dis:!!s.dis}; }
function setLike(link, key, val){
  var o = loadLikes();
  if(!o[link]) o[link] = {};
  o[link][key] = !!val;
  if(!o[link].fav && !o[link].dis) delete o[link];
  saveLikes(o);
}
function isDisliked(link){ return !!(loadLikes()[link] || {}).dis; }

/* ===== 历史搜索 / 历史阅读 ===== */
function loadSearchHist(){ try{ return JSON.parse(localStorage.getItem(SEARCH_HIST_KEY)) || []; }catch(e){ return []; } }
function saveSearchHist(a){ try{ localStorage.setItem(SEARCH_HIST_KEY, JSON.stringify(a)); }catch(e){} }
function addSearchHist(q){
  q = (q||"").trim(); if(!q) return;
  var a = loadSearchHist().filter(function(x){ return x!==q; });
  a.unshift(q);
  if(a.length>10) a = a.slice(0,10);
  saveSearchHist(a);
}
function loadReadHist(){ try{ return JSON.parse(localStorage.getItem(READ_HIST_KEY)) || []; }catch(e){ return []; } }
function saveReadHist(a){ try{ localStorage.setItem(READ_HIST_KEY, JSON.stringify(a)); }catch(e){} }
function recordRead(r){
  var a = loadReadHist().filter(function(x){ return x.t!==r.title; });
  a.unshift({t:r.title, d:r.date||"", link:r.link||"", time:new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})});
  if(a.length>20) a = a.slice(0,20);
  saveReadHist(a);
}

/* ===== 搜索 + 历史搜索 ===== */

  box.className = "show";

    + a.map(function(q){ return '<div class="si" data-q="'+esc(q)+'"><span class="q">'+esc(q)+'</span><span class="x">↗</span></div>'; }).join("");
  box.querySelectorAll(".si").forEach(function(si){

  $("tabQa").className = t==="qa"?"on":"";

/* ===== 统计概览 ===== */
function ovBar(label, val, max, color){
  var w = max>0 ? Math.max(3, Math.round(val/max*100)) : 0;
  return '<div class="ov-row"><div class="nm">'+esc(label)+'</div><div class="bar-bg"><div class="bar-fill" style="width:'+w+'%;background:'+color+'"></div></div><div class="cnt">'+val+'</div></div>';
}
function initOverview(){
  var recs = DATA.records;
  /* 顶部数字卡：只保留总数与覆盖月份数 */
  var upd = (DATA.meta && (DATA.meta.updated_at||DATA.meta.generated_at)) || "—";
  var monthsAll = {}, i, r;
  for(i=0;i<recs.length;i++){ r=recs[i];
    var mk = getMonthKey(r); if(mk) monthsAll[mk]=(monthsAll[mk]||0)+1;
  }
  var html = '<div class="ov-grid">'
    + '<div class="ov-num"><div class="v">'+recs.length+'</div><div class="l">收录报道总数</div></div>'
    + '<div class="ov-num"><div class="v">'+Object.keys(monthsAll).length+'</div><div class="l">覆盖月份数</div></div>'
    + '</div>';

  /* 分类分布 */
  var catArr = MAIN_CATS.filter(function(c){ return DATA.meta.cat_colors[c]; })
    .map(function(c){ return {c:c, n:recs.filter(function(x){return x.category===c;}).length}; })
    .filter(function(x){ return x.n>0; })
    .sort(function(a,b){ return b.n-a.n; });
  var catMax = Math.max.apply(null, catArr.map(function(x){return x.n;}));
  html += '<div class="ov-sec"><h2>业务分类分布<span class="upd">数据更新至 '+esc(upd)+'</span></h2>'
    + catArr.map(function(x){ return ovBar(x.c, x.n, catMax, DATA.meta.cat_colors[x.c].text); }).join("") + '</div>';

  /* 月份分布 */
  var mkArr = Object.keys(monthsAll).sort();
  var mkMax = Math.max.apply(null, mkArr.map(function(m){return monthsAll[m];}));
  html += '<div class="ov-sec"><h2>月份分布</h2>'
    + mkArr.map(function(m){ return ovBar(m, monthsAll[m], mkMax, "#2B6CB0"); }).join("") + '</div>';

  /* 主题标签分布 */
  var tp = {};
  recs.forEach(function(x){ tagsOf(x).forEach(function(t){ tp[t]=(tp[t]||0)+1; }); });
  var tpArr = Object.keys(tp).sort(function(a,b){ return tp[b]-tp[a]; });
  html += '<div class="ov-sec"><h2>主题标签分布</h2><div class="ov-tags">'
    + tpArr.map(function(t){ return '<span class="t">'+esc(t)+' <b>'+tp[t]+'</b></span>'; }).join("") + '</div></div>';

  /* 最近阅读 / 收藏报道 / 已隐藏报道 */
  html += '<div class="ov-sec"><h2>最近阅读<span class="upd">点击新闻卡片自动记录，最多 20 条</span></h2><div id="readHistList"></div></div>';
  html += '<div class="ov-sec"><h2>我收藏的报道<span class="upd">点击卡片 ♡ 收藏，可在此查看或取消</span></h2><div id="favNewsList"></div></div>';
  html += '<div class="ov-sec"><h2>已隐藏报道（不喜欢）<span class="upd">默认在列表中隐藏，可在此恢复</span></h2><div id="hiddenList"></div></div>';

  $("ovWrap").innerHTML = html;
  renderLikeLists();
}

/* ===== 最近阅读 / 收藏报道 / 已隐藏报道 ===== */
function recordByLink(link){ return DATA ? DATA.records.filter(function(r){ return r.link===link; })[0] : null; }
function renderLikeLists(){
  var rb = document.getElementById("readHistList");
  var fb = document.getElementById("favNewsList");
  var hb = document.getElementById("hiddenList");
  if(!rb || !fb || !hb) return;

  /* 最近阅读 */
  var rh = loadReadHist();
  if(!rh.length){ rb.innerHTML = '<div class="ov-empty">暂无阅读记录。点击任意新闻卡片（标题/摘要区域）或「查看原文」即自动记录。</div>'; }
  else {
    rb.innerHTML = rh.map(function(x,i){
      return '<div class="ov-li"><div class="nm">'+esc(x.t)+'<div class="d">'+esc(x.d)+' · '+esc(x.time)+'</div></div>'
        + (x.link && x.link.indexOf("http")===0 ? '<button class="op go" data-i="'+i+'">查看</button>' : '')
        + '<button class="op del" data-i="'+i+'" data-act="delread">删</button></div>';
    }).join("");
    rb.querySelectorAll(".op.go").forEach(function(b){
      b.onclick = function(){ var x = loadReadHist()[Number(b.getAttribute("data-i"))]; if(x && x.link) window.open(x.link,"_blank"); };
    });
    rb.querySelectorAll(".op.del").forEach(function(b){
      b.onclick = function(){ var a = loadReadHist(); a.splice(Number(b.getAttribute("data-i")),1); saveReadHist(a); renderLikeLists(); };
    });
  }

  /* 收藏报道 */
  var likes = loadLikes();
  var favLinks = Object.keys(likes).filter(function(k){ return likes[k].fav; });
  if(!favLinks.length){ fb.innerHTML = '<div class="ov-empty">暂无收藏。在新闻卡片上点「♡ 收藏」即可保存到此处。</div>'; }
  else {
    var fh = favLinks.map(function(l){ return recordByLink(l); }).filter(Boolean);
    if(!fh.length){ fb.innerHTML = '<div class="ov-empty">暂无收藏（原报道可能已不在数据中）。</div>'; }
    else {
      fb.innerHTML = fh.map(function(r,i){
        var cc = DATA.meta.cat_colors[r.category] || DATA.meta.cat_colors["其他民政业务"];
        return '<div class="ov-li"><div class="nm">'+esc(r.title)+'<div class="d"><span style="color:'+cc.text+'">'+esc(r.category)+'</span> · '+esc(r.date)+'</div></div>'
          + (r.link && r.link.indexOf("http")===0 ? '<button class="op go" data-i="'+i+'">查看</button>' : '')
          + '<button class="op del" data-i="'+i+'" data-act="unfav">取消收藏</button></div>';
      }).join("");
      var favArr = fh;
      fb.querySelectorAll(".op.go").forEach(function(b){
        b.onclick = function(){ var x = favArr[Number(b.getAttribute("data-i"))]; if(x && x.link) window.open(x.link,"_blank"); };
      });
      fb.querySelectorAll(".op.del").forEach(function(b){
        b.onclick = function(){ var x = favArr[Number(b.getAttribute("data-i"))]; if(x){ setLike(x.link,"fav",false); renderLikeLists(); toast("已取消收藏"); } };
      });
    }
  }

  /* 已隐藏报道 */
  var hidLinks = Object.keys(likes).filter(function(k){ return likes[k].dis; });
  if(!hidLinks.length){ hb.innerHTML = '<div class="ov-empty">暂无隐藏报道。</div>'; }
  else {
    var hh = hidLinks.map(function(l){ return recordByLink(l); }).filter(Boolean);
    if(!hh.length){ hb.innerHTML = '<div class="ov-empty">暂无隐藏报道（原报道可能已不在数据中）。</div>'; }
    else {
      hb.innerHTML = hh.map(function(r,i){
        return '<div class="ov-li"><div class="nm">'+esc(r.title)+'<div class="d">'+esc(r.date)+' · '+esc(r.source)+'</div></div>'
          + '<button class="op restore" data-i="'+i+'">恢复显示</button></div>';
      }).join("");
      var hidArr = hh;
      hb.querySelectorAll(".op.restore").forEach(function(b){
        b.onclick = function(){ var x = hidArr[Number(b.getAttribute("data-i"))]; if(x){ setLike(x.link,"dis",false); renderLikeLists(); toast("已恢复，切回「新闻检索」即可看到"); } };
      });
    }
  }
}

/* —— 意图词典：口语/关键词 → 业务分类、主题标签 —— */
var QA_CATS = {
  "养老":"养老服务","老年":"养老服务","长者":"养老服务","敬老":"养老服务","银发":"养老服务","老人":"养老服务",
  "慈善":"社区慈善","捐赠":"社区慈善","捐款":"社区慈善","募捐":"社区慈善","公益":"社区慈善","爱心":"社区慈善","义卖":"社区慈善",
  "救助":"社会救助","低保":"社会救助","特困":"社会救助","残疾":"社会救助","帮扶":"社会救助","慰问":"社会救助","微心愿":"社会救助",
  "儿童":"未成年人保护","未成年":"未成年人保护","未保":"未成年人保护","青少年":"未成年人保护","六一":"未成年人保护","亲子":"未成年人保护",
  "婚姻":"婚姻登记","结婚":"婚姻登记","颁证":"婚姻登记","婚俗":"婚姻登记","离婚":"婚姻登记","520":"婚姻登记","七夕":"婚姻登记",
  "社工":"社会组织","志愿":"社会组织","志愿者":"社会组织","社团":"社会组织","协会":"社会组织",
  "殡葬":"殡葬管理","墓园":"殡葬管理","祭扫":"殡葬管理",
  "区划":"区划地名","地名":"区划地名",
  "社区治理":"基层治理","基层":"基层治理","居委会":"基层治理","村委会":"基层治理","网格":"基层治理"
};
var QA_TAGS = {
  "银发经济":"银发经济","智慧养老":"智慧养老","适老化":"智慧养老",
  "敬老助老":"敬老助老","长者饭堂":"敬老助老","颐康中心":"敬老助老",
  "婚俗改革":"婚俗改革","集体颁证":"集体颁证","甜蜜经济":"甜蜜经济","婚姻家庭辅导":"婚姻家庭辅导","婚姻辅导":"婚姻家庭辅导",
  "公益集市":"公益集市","爱心妈妈":"爱心妈妈","慈善募捐":"慈善募捐","志愿服务":"志愿服务"
};

function tokenize(q){
  var arr = q.split(/[\s,，。、；;：:？！!?]+/).filter(Boolean);
  var out = [];
  arr.forEach(function(w){ if(STOP.indexOf(w)<0) out.push(w); });
  return out.length ? out : [q];
}
function detectMonth(q){
  var m = q.match(/(20\d{2})年(\d{1,2})月/);
  if(m) return {y:m[1], m:("0"+m[2]).slice(-2)};
  var now = new Date();
  if(/上个月/.test(q)){ var d1=new Date(now.getFullYear(), now.getMonth()-1, 1); return {y:String(d1.getFullYear()), m:("0"+(d1.getMonth()+1)).slice(-2)}; }
  if(/本月|这个月/.test(q)) return {y:String(now.getFullYear()), m:("0"+(now.getMonth()+1)).slice(-2)};
  var m2 = q.match(/(\d{1,2})月/);
  if(m2) return {y:String(now.getFullYear()), m:("0"+m2[1]).slice(-2)};
  return null;
}
function isLatest(q){ return /最新|最近|近期|新进展/.test(q); }
function isCountQ(q){ return /多少|几条|共.*条|总共|统计|数量|几个|有多少/.test(q); }
function isGreet(q){ return /^(你好|您好|嗨|hi|hello|哈喽|在吗|谢谢|感谢|辛苦)/i.test(q); }
function intentCat(q){
  var keys = Object.keys(QA_CATS).sort(function(a,b){ return b.length-a.length; });
  for(var i=0;i<keys.length;i++){ if(q.indexOf(keys[i])>=0) return QA_CATS[keys[i]]; }
  return null;
}
function intentTag(q){
  var keys = Object.keys(QA_TAGS).sort(function(a,b){ return b.length-a.length; });
  for(var i=0;i<keys.length;i++){ if(q.indexOf(keys[i])>=0) return QA_TAGS[keys[i]]; }
  return null;
}
function qaItemHtml(r){
  var cc = DATA.meta.cat_colors[r.category] || DATA.meta.cat_colors["其他民政业务"];
  return '<div class="qa-item"><div class="t">'+esc(r.date)+' · '+esc(r.title)+'</div>'
    + '<div class="m">'+esc((r.summary||"").slice(0,80))+(r.summary&&r.summary.length>80?"…":"")+'</div>'
    + '<div class="d"><span style="color:'+cc.text+'">'+esc(r.category)+'</span> · '+esc(r.source)+' · '
    + (r.link && r.link.indexOf("http")===0 ? '<a href="'+esc(r.link)+'" target="_blank">查看原文</a>' : '无独立链接') + '</div></div>';
}
function ask(q){
  q = (q||"").trim();
  /* 1. 问候 / 致谢 */
  if(isGreet(q)) return "你好！我是民政新闻检索助手。可以这样问我：<br>· 「5月有哪些养老新闻？」<br>· 「慈善社区我先行 最新进展」<br>· 「低保 相关报道有多少条？」<br>· 「一共收录了多少条？」<br>也可以直接输入关键词。";
  var month = detectMonth(q), latest = isLatest(q), cat = intentCat(q), tag = intentTag(q);
  /* 2. 统计数量 */
  if(isCountQ(q)){
    var pool = visibleRecords().filter(function(r){
      if(cat && r.category!==cat) return false;
      if(tag && !tagHit(r,tag)) return false;
      if(month){ var sk=sortKey(r.date); if(sk.indexOf(month.y+"-"+month.m)!==0) return false; }
      return true;
    });
    var d2 = [];
    if(cat) d2.push("「"+cat+"」"); if(tag) d2.push("「"+tag+"」");
    if(month) d2.push(month.y+"年"+month.m.replace(/^0/,"")+"月");
    if(!pool.length) return (d2.length?d2.join(" · ")+" 下":"当前范围内")+"暂无收录报道。";
    return (d2.length?d2.join(" · ")+" 下共有":"当前检索范围内共有")+" <b>"+pool.length+"</b> 条报道。" + (pool.length>5? " 为你展示前 5 条：<br>":" 全部列出：<br>") + pool.slice(0,5).map(qaItemHtml).join("");
  }
  /* 3. 最新 / 最近 */
  if(latest){
    var pool2 = visibleRecords().filter(function(r){
      if(cat && r.category!==cat) return false;
      if(tag && !tagHit(r,tag)) return false;
      return true;
    });
    if(!pool2.length) return "「"+(cat||tag||"该主题")+"」暂无相关报道。";
    return "「"+(cat||tag||"全部报道")+"」最近 10 条（按日期倒序）：" + pool2.slice(0,10).map(qaItemHtml).join("");
  }
  /* 4. 自然语言映射：分类 / 主题 / 月份 */
  if(cat || tag || month){
    var tokens = tokenize(q);
    var scored = visibleRecords().map(function(r){
      var s = 0;
      if(cat && r.category===cat) s += 6;
      if(tag && tagHit(r,tag)) s += 6;
      if(month){ var sk=sortKey(r.date); if(sk.indexOf(month.y+"-"+month.m)===0) s += 3; else s -= 5; }
      var hay = (r.title+" "+(r.summary||"")+" "+r.category+" "+r.extra_cats.join(" ")+" "+(r.source||"")).toLowerCase();
      tokens.forEach(function(t){
        var tl = t.toLowerCase(); if(!tl) return;
        if(r.title && r.title.toLowerCase().indexOf(tl)>=0) s += 4;
        else if(hay.indexOf(tl)>=0) s += 2;
      });
      return {r:r, s:s};
    });
    var arr = scored.filter(function(x){ return x.s>0; }).sort(function(a,b){ return b.s-a.s || (sortKey(b.r.date)<sortKey(a.r.date)?-1:1); });
    var top = arr.slice(0,8).map(function(x){ return x.r; });
    if(!top.length) return "没有找到相关报道。试试：养老、慈善、520颁证、困境儿童、低保、社会组织。";
    var d4 = [];
    if(cat) d4.push(cat); if(tag) d4.push(tag); if(month) d4.push(month.y+"年"+month.m.replace(/^0/,"")+"月");
    return "「"+d4.join(" · ")+"」相关报道 "+arr.length+" 条（按相关度排序，前 8 条）：" + top.map(qaItemHtml).join("");
  }
  /* 5. 纯关键词兜底 */
  var tokens2 = tokenize(q);
  var scored2 = visibleRecords().map(function(r){
    var s = 0;
    var hay = (r.title+" "+(r.summary||"")+" "+r.category+" "+r.extra_cats.join(" ")+" "+(r.source||"")+" "+(r.note||"")).toLowerCase();
    tokens2.forEach(function(t){
      var tl = t.toLowerCase(); if(!tl) return;
      if(r.title && r.title.toLowerCase().indexOf(tl)>=0) s += 4;
      else if(hay.indexOf(tl)>=0) s += 2;
      if((r.category||"").toLowerCase().indexOf(tl)>=0) s += 1;
    });
    return {r:r, s:s};
  });
  var arr2 = scored2.filter(function(x){ return x.s>0; }).sort(function(a,b){ return b.s-a.s || (sortKey(b.r.date)<sortKey(a.r.date)?-1:1); });
  if(!arr2.length) return "没有找到与「"+esc(q)+"」相关的报道。建议换关键词试试：养老、慈善、520颁证、困境儿童、低保、社会组织。";
  return "找到 <b>"+arr2.length+"</b> 条相关报道（按相关度排序，前 8 条）：" + arr2.slice(0,8).map(function(x){ return qaItemHtml(x.r); }).join("");
}

/* ===== 下拉刷新 ===== */
var PULL_TH = 55;
var pull = {startY:0, active:false, dist:0, refreshing:false};

function resetPull(){

  $("pullWrap").style.height = "56px";
  fetch(DATA_URL + "?v=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){
      DATA = j;
      j.records.sort(function(a,b){ return sortKey(b.date) < sortKey(a.date) ? -1 : 1; });
      var upd = j.meta && (j.meta.updated_at || j.meta.generated_at) || "";
      $("metaInfo").textContent = upd ? "共 " + j.meta.total + " 条 · 更新至 " + upd : "共 " + j.meta.total + " 条";
      initChips(); render(); initOverview();
      finishRefresh("✓ 已更新至最新");
    })
    .catch(function(){ finishRefresh("刷新失败，请检查网络"); });
}
document.addEventListener("touchstart", function(e){
  if(pull.refreshing || !DATA) return;
  if(window.scrollY<=0){ pull.startY = e.touches[0].clientY; pull.active = true; }
}, {passive:true});
document.addEventListener("touchmove", function(e){
  if(!pull.active || pull.refreshing) return;
  if(window.scrollY>0){ pull.active=false; resetPull(); return; }
  var dy = e.touches[0].clientY - pull.startY;
  if(dy<=0){ if(pull.dist>0) resetPull(); return; }
  pull.dist = Math.min(90, dy*0.45);
  applyPull(pull.dist);
}, {passive:true});
document.addEventListener("touchend", function(){
  if(!pull.active) return;
  pull.active = false;
  if(pull.dist >= PULL_TH) refreshData();
  else resetPull();
});
$("refreshBtn").onclick = function(){
  if(pull.refreshing) return;
  pull.refreshing = true;
  $("pullText").textContent = "正在刷新…";
  $("pullIc").className = "pull-ic spin";
  $("pullWrap").style.height = "56px";
  refreshData();
};

/* ===== 分享弹窗（海报模式） ===== */
function curUrl(){
  var u = location.href.split("#")[0].split("?")[0];
  return u;
}
$("shareBtn").onclick = function(){
  $("shareModal").className = "modal-mask show";
  $("shareUrl").value = curUrl();
  $("wxTip").style.display = /MicroMessenger/i.test(navigator.userAgent) ? "block" : "none";
};
$("closeShare").onclick = function(){ $("shareModal").className = "modal-mask"; };
$("shareModal").addEventListener("click", function(e){ if(e.target===this) this.className="modal-mask"; });
/* 下载海报：优先走 blob 下载；微信 webview 等不支持时回退为新窗口打开，长按保存 */
function savePoster(){
  var btn = $("savePosterBtn"), src = $("posterImg").src, fname = "民政新闻助手海报.png";
  function fallback(){
    try{ window.open(src, "_blank"); }catch(e){}
    btn.textContent = "已新开窗口，长按图片保存";
    setTimeout(function(){ btn.textContent = "下载海报"; }, 2500);
  }
  try{
    fetch(src, {mode:"cors"})
      .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
      .then(function(b){
        var url = URL.createObjectURL(b);
        var a = document.createElement("a");
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
        btn.textContent = "已开始下载";
        setTimeout(function(){ btn.textContent = "下载海报"; }, 2000);
      })
      .catch(fallback);
  }catch(e){ fallback(); }
}
$("savePosterBtn").onclick = savePoster;
$("copyUrlBtn").onclick = function(){
  var btn = this;
  copyText($("shareUrl").value, function(){ btn.textContent = "已复制"; setTimeout(function(){ btn.textContent="复制链接"; },1600); },
    function(){ $("shareUrl").select(); btn.textContent = "请长按输入框复制"; setTimeout(function(){ btn.textContent="复制链接"; },2000); });
};

loadData();
</script>
